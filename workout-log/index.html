<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1C1C1C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tahmid’s Log" />
    <meta name="description" content="Tahmid’s personal training log" />
    <title>Tahmid’s Workout Log</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link
      rel="icon"
      href="./icons/favicon-32x32.png"
      type="image/png"
      sizes="32x32"
    />
    <link
      rel="icon"
      href="./icons/favicon-16x16.png"
      type="image/png"
      sizes="16x16"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header>
        <div class="header-copy">
          <a class="brand" href="./">Tahmid’s Workout Log</a>
          <p id="header-date"></p>
        </div>
        <button
          id="settings-button"
          class="icon-button"
          data-view="settings"
          aria-label="Settings"
          title="Settings"
        ></button>
      </header>
      <div class="app-status"></div>
      <nav id="nav" aria-label="Main navigation" hidden></nav>
      <div id="message" role="status" aria-live="polite"></div>
      <main id="main" tabindex="-1"><p>Opening your workout log…</p></main>
      <footer>Tahmid’s personal training log</footer>
    </div>
    <dialog
      id="reset-dialog"
      aria-labelledby="reset-title"
      aria-describedby="reset-description"
    ></dialog>
    <noscript>This workout logger needs JavaScript enabled.</noscript>
    <script src="./js/config.js"></script>
    <script type="module" src="./js/app.js?v=reset-enabled"></script>
  </body>
</html>
